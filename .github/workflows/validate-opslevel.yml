name: Validate OpsLevel Configs
permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    paths:
      - '**/opslevel.yml'
      - '**/opslevel.yaml'
      - '.github/workflows/validate-opslevel.yml'
  pull_request:
    paths:
      - '**/opslevel.yml'
      - '**/opslevel.yaml'
      - '.github/workflows/validate-opslevel.yml'

jobs:
  validate:
    runs-on: ee-runner
    steps:
      - uses: actions/checkout@v7
      - uses: springernature/ee-action-validate-opslevel@dfcf34f8a0cdb6f0aad572592dae6943d94db2c0 # v1.0.14
        with:
          opslevel_api_token: ${{ secrets.OPSLEVEL_RW_TOKEN }}
